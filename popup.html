<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>少邻国</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
    body { width: 320px; margin: 0; color: #172033; background: #f7f9fc; }
    header { padding: 19px 20px 14px; color: white; background: linear-gradient(135deg, #155eef, #7357e7); }
    h1 { margin: 0; font-size: 21px; letter-spacing: .02em; }
    header p { margin: 5px 0 0; font-size: 12px; opacity: .86; }
    main { padding: 16px 18px 18px; }
    .switch-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; font-weight: 650; }
    .switch { position: relative; width: 44px; height: 26px; }
    .switch input { position: absolute; opacity: 0; }
    .slider { position: absolute; inset: 0; cursor: pointer; border-radius: 99px; background: #aab2c0; transition: .16s; }
    .slider::after { content: ""; position: absolute; width: 20px; height: 20px; top: 3px; left: 3px; border-radius: 50%; background: white; box-shadow: 0 1px 4px #0003; transition: .16s; }
    input:checked + .slider { background: #155eef; }
    input:checked + .slider::after { transform: translateX(18px); }
    label.field { display: block; margin-top: 11px; color: #4b5568; font-size: 12px; font-weight: 650; }
    select { box-sizing: border-box; width: 100%; margin-top: 6px; padding: 10px 11px; border: 1px solid #cbd2df; border-radius: 9px; background: white; color: #172033; font-size: 14px; }
    .arrow { margin: 10px 0 -2px; color: #697386; text-align: center; font-size: 18px; }
    button { width: 100%; margin-top: 16px; padding: 11px 14px; border: 0; border-radius: 9px; color: white; background: #155eef; font-size: 14px; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    #status { min-height: 18px; margin: 9px 0 0; color: #257246; text-align: center; font-size: 12px; }
    .advanced { display: block; margin-top: 6px; color: #596579; text-align: center; font-size: 12px; text-decoration: none; }
    .advanced:hover { color: #155eef; }
  </style>
</head>
<body>
  <header>
    <h1>少邻国</h1>
    <p>原位翻译，不弹框，不遮挡网页</p>
  </header>
  <main>
    <div class="switch-row">
      <span>在网页中自动翻译</span>
      <label class="switch">
        <input id="enabled" type="checkbox">
        <span class="slider"></span>
      </label>
    </div>

    <label class="field" for="sourceLanguage">网页原文</label>
    <select id="sourceLanguage">
      <option value="auto">自动识别</option>
      <option value="en">英语</option>
      <option value="zh">中文</option>
      <option value="ja">日语</option>
      <option value="ko">韩语</option>
      <option value="es">西班牙语</option>
      <option value="fr">法语</option>
      <option value="de">德语</option>
      <option value="ru">俄语</option>
      <option value="ar">阿拉伯语</option>
      <option value="pt">葡萄牙语</option>
      <option value="it">意大利语</option>
      <option value="tr">土耳其语</option>
      <option value="vi">越南语</option>
      <option value="th">泰语</option>
    </select>

    <div class="arrow">↓</div>

    <label class="field" for="targetLanguage">翻译成</label>
    <select id="targetLanguage">
      <option value="zh">简体中文</option>
      <option value="en">英语</option>
      <option value="ja">日语</option>
      <option value="ko">韩语</option>
      <option value="es">西班牙语</option>
      <option value="fr">法语</option>
      <option value="de">德语</option>
      <option value="ru">俄语</option>
      <option value="ar">阿拉伯语</option>
      <option value="pt">葡萄牙语</option>
      <option value="it">意大利语</option>
      <option value="tr">土耳其语</option>
      <option value="vi">越南语</option>
      <option value="th">泰语</option>
    </select>

    <button id="apply" type="button">应用并刷新当前网页</button>
    <p id="status" role="status"></p>
    <a class="advanced" id="advanced" href="#">设置不翻译的品牌和专有词</a>
  </main>
  <script src="popup.js"></script>
</body>
</html>
