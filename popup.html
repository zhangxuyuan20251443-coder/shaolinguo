<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>少邻国</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
    }
    * { box-sizing: border-box; }
    html {
      background: #000000;
      overflow: hidden;
    }
    body {
      width: 252px;
      margin: 0;
      padding: 8px;
      color: #f5f5f7;
      background: #000000;
      font-size: 13px;
    }
    main {
      display: grid;
      grid-template-columns: 58px minmax(0, 1fr);
      align-items: center;
      gap: 6px 10px;
      padding: 13px 14px 11px;
      overflow: hidden;
      background: linear-gradient(180deg, #4a4a4d 0%, #39393c 100%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }
    label {
      font-size: 14px;
      font-weight: 650;
      letter-spacing: -0.15px;
      white-space: nowrap;
    }
    select {
      width: 100%;
      height: 36px;
      margin: 0;
      padding: 0 10px;
      color: #ffffff;
      background: #555558;
      border: 1px solid #7a7a7d;
      border-radius: 10px;
      font: inherit;
      font-size: 14px;
      outline: none;
    }
    select:hover {
      background: #5d5d60;
      border-color: #929295;
    }
    select:focus-visible {
      border-color: #a8c7ff;
      box-shadow: 0 0 0 3px rgba(76, 139, 245, 0.32);
    }
    select:disabled {
      opacity: 0.72;
    }
    #status {
      grid-column: 2;
      min-height: 15px;
      color: #c9c9ce;
      font-size: 11px;
      line-height: 15px;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <main>
    <label for="targetLanguage">翻译成</label>
    <select id="targetLanguage">
      <option value="zh">简体中文</option>
      <option value="en">英语</option>
      <option value="ja">日语</option>
      <option value="ko">韩语</option>
      <option value="es">西班牙语</option>
      <option value="fr">法语</option>
      <option value="de">德语</option>
      <option value="ru">俄语</option>
      <option value="ar">阿拉伯语</option>
      <option value="pt">葡萄牙语</option>
      <option value="it">意大利语</option>
      <option value="tr">土耳其语</option>
      <option value="vi">越南语</option>
      <option value="th">泰语</option>
    </select>
    <span id="status" role="status" aria-live="polite">正在读取设置…</span>
  </main>
  <script src="popup.js"></script>
</body>
</html>
