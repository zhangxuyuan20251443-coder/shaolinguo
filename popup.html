<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>少邻国</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
    }
    * { box-sizing: border-box; }
    html {
      background: #000000;
      overflow: hidden;
    }
    body {
      width: 228px;
      margin: 0;
      padding: 0;
      color: #f5f5f7;
      background: #000000;
      font-size: 13px;
    }
    main {
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr);
      align-items: center;
      gap: 6px 10px;
      padding: 13px 14px 11px;
      overflow: hidden;
      background: #000000;
      border: 0;
      box-shadow: none;
    }
    label {
      font-size: 14px;
      font-weight: 650;
      letter-spacing: -0.15px;
      white-space: nowrap;
    }
    .target-language {
      width: 100%;
      height: 36px;
      margin: 0;
      padding: 0 10px;
      color: #ffffff;
      background: #68686d;
      border: 1px solid #929297;
      border-radius: 12px;
      font: inherit;
      font-size: 14px;
      line-height: 34px;
      white-space: nowrap;
    }
    #status {
      grid-column: 1 / -1;
      min-height: 15px;
      color: #c9c9ce;
      font-size: 11px;
      line-height: 15px;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <main>
    <label>翻译为</label>
    <div class="target-language">简体中文</div>
    <span id="status" role="status" aria-live="polite">正在读取设置…</span>
  </main>
  <script src="popup.js"></script>
</body>
</html>
